<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Charlie Ivin</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="description" content="Page not found." />
  <style>
    :root {
      --bg: #08090d;
      --text: #f4f7fb;
      --muted: #a4adbb;
      --accent: #6d5dfc;
      --accent-2: #00cfff;
      --border: rgba(255, 255, 255, 0.12);
      --glow: 0 0 30px rgba(0, 207, 255, 0.15);
      --max-width: 1150px;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
    }
    body {
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(109, 93, 252, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(0, 207, 255, 0.14), transparent 28%),
        linear-gradient(180deg, #07080c 0%, #0d1017 45%, #08090d 100%);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .container {
      width: min(92%, var(--max-width));
      margin: 0 auto;
    }
    .blur {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.28;
      z-index: 0;
      pointer-events: none;
    }
    .blur.one {
      top: 60px;
      left: -100px;
      background: var(--accent);
    }
    .blur.two {
      right: -100px;
      bottom: 40px;
      background: var(--accent-2);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
      background: rgba(7, 8, 12, 0.72);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--text);
    }
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 0;
    }
    .error-content {
      max-width: 560px;
      width: 100%;
    }
    .error-code {
      font-size: clamp(5.5rem, 18vw, 9rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.06em;
      margin-bottom: 18px;
      background: linear-gradient(90deg, #ffffff, #8fdfff, #9485ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    h1 {
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }
    p {
      color: var(--muted);
      font-size: 1.08rem;
      margin-bottom: 32px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 22px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(109, 93, 252, 0.2), rgba(0, 207, 255, 0.14));
      color: var(--text);
      font-weight: 700;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: var(--glow);
    }
    .btn:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .btn.secondary {
      background: transparent;
      box-shadow: none;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    footer {
      padding: 28px 0 36px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      position: relative;
      z-index: 1;
    }
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 680px) {
      .actions {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="blur one"></div>
  <div class="blur two"></div>

  <header>
    <div class="container nav">
      <a href="/" class="logo">Charlie Ivin</a>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="error-content reveal">
        <div class="error-code">404</div>
        <h1>Page not found</h1>
        <p>
          The page you’re looking for doesn’t exist or has been moved.
          Let’s get you back on track.
        </p>
        <div class="actions">
          <a href="/" class="btn">Back to Home</a>
          <a href="mailto:charlie@charlieivin.co.uk" class="btn secondary">Email Me</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 Charlie Ivin. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const reveals = document.querySelectorAll(".reveal");
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
        }
      });
    }, { threshold: 0.12 });
    reveals.forEach((item) => observer.observe(item));

    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
